<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        .card {
            width: 750px;
            margin: 30px auto 30px auto;
            padding: 0;
            text-align: center;
            border: 18px solid #102D82;
            border-radius: 50px;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .card:hover {
            border-color: #d4af37;
            transform: scale(1.0025);
        }

        .card img {
            width: 100%;
        }

        .hero {
            position: relative;
        }

        .heroimage {
            height: 318px;
            object-fit: cover;
            object-position: top;
        }

        .hero h1, .hero h2 {
            position: absolute;
            color: white;
            left: 0;
            right: 0;
            text-shadow: 4px 4px 2px black;
        }

        .hero h1 {
            top: 138px;
            font-size: 66px;
        }

        .hero h2 {
            top: 215px;
            font-size: 56px;
            font-weight: normal;
        }

        #closeBtn {
            position: absolute;
            top: 20px;
            left: 28px;
            font-size: 30px;
            font-weight: 550;
            padding: 2px 14px;
            border-radius: 3px;
            background: #f5f5f5;
        }

        #formContainer {
            padding: 20px 40px 35px 40px;
        }

        #formContainer h3 {
            margin-top: 20px;
            margin-bottom: 36px;
            font-size: 34px;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 38px;
            text-align: left;
            font-size: 32px;
        }

        #myForm section {
            grid-column: 1 / -1;
            text-align: center;
        }

        #myForm input {
            width: 100%;
            height: 36px;
            font-size: 22px;
            border: 2px solid grey;
            border-radius: 4px;
        }

        #myForm input[type="radio"], #myForm input[type="checkbox"] {
            width: 24px;
            height: 24px;
            appearance: none;
            vertical-align: middle;
            position: relative;
            top: -3px;
            margin-right: 6px;
            border: 2px solid grey;
        }

        #myForm input[type="radio"] {
            border-radius: 50px;
            margin-right: 1px;
        }

        #myForm input[type="radio"]:checked, #myForm input[type="checkbox"]:checked {
            background: #d4af37;
        }

        #female {
            margin-left: 20px;
        }

        #myForm input[type="checkbox"]:checked::after {
            content: "\2713";
            color: white;
            display: block;
            text-align: center;
            font-size: 20px;
            line-height: 20px;
            font-weight: bold;
        }

        #myForm label:nth-of-type(4), #myForm div {
            margin-top: -2px;
        }

        #myForm section:nth-of-type(1) {
            margin-top: -6px;
        }

        #myForm section:nth-of-type(2) {
            margin-top: -5px;
        }

        #myForm button {
            height: 39px;
            font-size: 25px;
            font-weight: 500;
            color: black;
            padding: 0 11px;
            margin-top: -6px;
            position: relative;
            top: -3px;
            border: 2px solid #777777;
            border-radius: 4px;
        }

        #myForm button:hover {
            background: #d4af37;
            cursor: pointer; 
        }

        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            /* margin-top: -2px; */
        }

    </style>




</head>

<body>
    <div class="card">
        <div class="hero">
            <img class="heroimage" src="images/jesus_feeds_5000.jpeg" alt="Jesus feeding the 5000">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
            <button type="button" id="closeBtn">X</button>
        </div>

        <div id="formContainer">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
            
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                <div>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>

                <section>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section>
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section>
                    <button type="submit">Submit</button>
                </section>
            </form>
        </div>

        <div class="books">
                <img src="images/old_testament.webp" alt="image of old testament soft black cover with gold embossing">
                <img src="images/new_testament.webp" alt="image of new testament soft black cover with gold embossing">
                <img src="images/book_of_mormon.webp" alt="image of book of mormon soft black cover with gold embossing">
                <img src="images/doctrine_and_covenants.webp" alt="image of doctrine and covenants soft black cover with gold embossing">
                <img src="images/pearl_of_great_price.webp" alt="image of pearl of great price soft black cover with gold embossing">
            </div>

        <div id="output"></div>

        <script>
            // Here is some Javascript to start looking forward to wdd131
            document.getElementById("closeBtn").addEventListener("click", function () {
                document.getElementById("formContainer").style.display = "none";
            });
            const form = document.getElementById('myForm');
            const output = document.getElementById('output');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Stop form from actually submitting

                const formData = new FormData(form);
                const entries = [];

                for (const [key, value] of formData.entries()) {
                    if (key == "password") {
                        entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                    } else {
                        entries.push(`<strong>${key}</strong>: ${value}`);
                    }
                }

                output.innerHTML = `
                <br>  
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join('')}
                </ul>
                `;
                    });
        </script>
    </div>
</body>

</html>
