<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
            <tr>
                <th>Speaker</th>
                <th>Title</th>
                <th>Location</th>
                <th>Year</th>
            </tr>
            <tr>
                <td>Elder Jeffrey R. Holland</td>
                <td>Cast Not Away Therefore Your Confidence</td>
                <td>Brigham Young University</td>
                <td>1999</td>
            </tr>
            <tr>
                <td>Sister Janine Gilbert</td>
                <td>A Work in Progress</td>
                <td>BYU-Idaho</td>
                <td>2019</td>
            </tr>
            <tr>
                <td>Brother Kevin Galbraith</td>
                <td>Faith and Family</td>
                <td>BYU-Idaho</td>
                <td>2019</td>
            </tr>
         </table>
         <form>
            <fieldset>
                <legend>Add Another Devotional</legend>

                <label for="speaker">Speaker</label>
                <input type="text" id="speaker" name="speaker">

                <label for="title">Title</label>
                <input type="text" id="title" name="title">

                <label for="location">Location</label>
                <input type="text" id="location" name="location">

                <label for="year">Year</label>
                <input type="number" id="year" name="year">

                <input type="submit" value="Add Devotional">
            </fieldset>
         </form>
      </div>
    </main>
  </div>
</body>
</html>
